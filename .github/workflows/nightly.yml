name: Nightly Build

# Thin caller for the Shared-Stash/workflows reusable ci-image.yml.
# Everything (matrix resolution from versions.yml + skip-gate + multi-arch
# build + deprecate + 90-day cleanup) lives in the reusable workflow.

on:
  schedule:
    - cron: "0 6 * * *"            # 06:00 UTC nightly
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "versions.yml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      dry_run_cleanup:
        description: "Cleanup runs in dry-run mode (no deletions)"
        type: boolean
        default: false
      force_build:
        description: "Bypass the skip-if-unchanged gate"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: Shared-Stash/workflows/.github/workflows/ci-image.yml@main
    with:
      image_name: playwright
      versions_config_path: versions.yml
      tag_pattern: "^[0-9]+\\.[0-9]+(\\.[0-9]+)?-node[0-9]+$"
      # Docker Hub mirror namespace: the bitsnbites org doesn't exist on
      # Docker Hub (only on GitHub), so we use the personal account that
      # owns the matching DOCKERHUB_TOKEN. Migrate to a real bitsnbites
      # Docker Hub org later if desired and update this value.
      dockerhub_namespace: bitsnbites010
      dry_run_cleanup: ${{ inputs.dry_run_cleanup || false }}
      force_build: ${{ inputs.force_build || false }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
